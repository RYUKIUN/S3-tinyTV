[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.esp-idf.sdkconfig_path = sdkconfig.defaults

; ── N16R8: 16MB QIO Flash + 8MB OPI PSRAM ───────────────────────────────────
; This line is CRITICAL for N16R8. Without it, PSRAM is "found" but not
; mapped to the heap, so heap_caps_malloc(MALLOC_CAP_SPIRAM) silently fails
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB_ota.csv

monitor_speed = 115200
monitor_rts = 1
monitor_dtr = 1

; ── Upload: comment/uncomment to switch between wired and OTA ───────────────
; upload_protocol = esptool                  ; USB (wired — required for first flash)
upload_protocol = espota                     ; OTA (wireless — all subsequent flashes)
upload_port = esp32s3-display.local
board_build.filesystem = spiffs

; JPEGDEC is forked into lib/JPEGDEC (S3 PIE IDCT work) — not pulled from the
; registry any more. lib/ always wins dependency resolution over lib_deps, so
; leaving the old pin here would just be misleading about which copy builds.
lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16

build_flags =
    ; PSRAM - N16R8 OPI
    -DBOARD_HAS_PSRAM
    ; S3 USB CDC
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLGFX_USE_V1
    -DESP32S3
    -O3
    -DCONFIG_SPIRAM_SPEED_80M
    -ffast-math
    -DCONFIG_ESP32S3_DATA_CACHE_64KB
    -DCONFIG_IDF_TARGET_ESP32S3
    -DIDCT_USE_SIMD=0
    -DJPEG_PROFILE=1  ; uncomment to split decode time into Huffman/IDCT
    ;                     shares (HUF:/IDC: fields in the debug overlay).
    ;                     Off by default: costs two extra function-call
    ;                     wrappers per MCU block when on.

board_build.f_cpu = 240000000L